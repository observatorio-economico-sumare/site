name: "OES | Coleta exploratoria oficial (sem publicacao)"
on:
  push:
    branches:
      - pesquisa/coletor-fontes-oficiais-20261023
      - dados/validacao-pendencias-20261023
    paths:
      - .github/workflows/oes-coleta-exploratoria.yml
      - scripts/oes_coleta/**
      - tests/test_oes_coleta.py
      - tests/test_sidra_evidence.py
      - tests/test_evidencias_complementares.py
      - scripts/pipeline.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oes-pesquisa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coleta-exploratoria:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch de pesquisa
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes unitarios sem rede
        run: |
          python -m unittest discover -s tests -v
          python scripts/pipeline.py validate
      - name: Consultas oficiais (nao publicadas)
        run: python scripts/oes_coleta/coletar.py --output oes-resultado
      - name: Extrair planilhas municipais oficiais (agregadas)
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          python scripts/oes_coleta/extrair_planilhas.py --output oes-resultado
      - name: Sumario de execucao
        run: |
          python -c 'import json; d=json.load(open("oes-resultado/relatorio.json")); print("Requisicoes:",d["requests"],"Arquivos JSON:",d["downloaded_json"],"Linhas candidatas:",d["candidate_rows"],"Status:",d["status_counts"])'
      - name: Evidencias SIDRA resumidas no log
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          for name in ("sidra_6580_desocupacao_2022", "sidra_10264_previdencia_2022", "sidra_10056_metadados"):
              path = Path("oes-resultado/raw") / (name + ".json")
              if path.exists():
                  raw = path.read_bytes()
                  print("OES_BEGIN", name, hashlib.sha256(raw).hexdigest(), len(raw))
                  print(raw.decode("utf-8")[:24000])
                  print("OES_END", name)
              else:
                  print("OES_MISSING", name)
          PY
      - name: Arquivar somente artefatos, sem commit e sem deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oes-evidencias-exploratorias
          path: oes-resultado/
          retention-days: 14
          if-no-files-found: warn
