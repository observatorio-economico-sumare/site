# Publicação automática somente após testes aprovados na main; opção manual preservada.
name: OES | Publicação
on:
  workflow_run:
    workflows: ["OES | Validação"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      confirmar_publicacao:
        description: 'Digite PUBLICAR somente após revisão e decisão de colocar o site no ar'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preparar:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name == 'workflow_dispatch' &&
         github.event.inputs.confirmar_publicacao == 'PUBLICAR')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Validar dados e código
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/pipeline.py validate
          python3 scripts/pipeline.py build
          python3 scripts/check_site.py
          node --check site/assets/js/app.js
          node --check site/assets/js/indicators.js
          node --check site/assets/js/empresas.js
          git diff --exit-code -- site/data/indicators.json
      - name: Publicar artefato estático validado
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
