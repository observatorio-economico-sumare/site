name: OES | Gerar mapa censitário (temporário)
on:
  push:
    branches: [oes/mapa-censo-2022]
permissions:
  contents: write
jobs:
  mapa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obter geometrias e dados oficiais
        run: |
          python -m pip install pyshp==2.3.1
          python scripts/build_mapa.py
          python -m unittest discover -s tests -p 'test_mapa.py' -v
      - name: Salvar evidência publicada
        run: |
          git config user.name "OES data builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/mapa-regioes-2022.json
          git commit -m "data: agregar IBGE 2022 por regiões oficiais de Sumaré"
          git push origin HEAD:oes/mapa-censo-2022
